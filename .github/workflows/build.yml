name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🐦 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ⚙️ Configure Flutter Java
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          java -version
          flutter --version

      - name: 📦 Create Flutter Android project
        run: |
          rm -rf temp_app
          mkdir temp_app
          cd temp_app

          flutter create \
            --project-name telegram_app \
            --platforms=android \
            .

      - name: 📁 Copy application code
        run: |
          cp -r lib/. temp_app/lib/

      - name: 📚 Get dependencies
        working-directory: temp_app
        run: flutter pub get

      - name: 🔨 Build APK
        working-directory: temp_app
        run: flutter build apk --debug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-app-debug
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
